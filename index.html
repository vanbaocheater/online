<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng về Telegram...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #334155;
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #f1f5f9;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .error-message {
            color: #ef4444;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner" id="loader"></div>
        <h2 id="status-title">Xác thực thành công!</h2>
        <p id="status-desc">Hệ thống đang chuyển hướng bạn quay lại Telegram để nhận Key...</p>
        
        <a id="telegram-btn" href="#" class="btn" style="display: none;">Mở Telegram Nhận Key</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Lấy tham số từ URL
            const urlParams = new URLSearchParams(window.location.search);
            const botUsername = urlParams.get('bot');
            const startParam = urlParams.get('start');

            const loader = document.getElementById('loader');
            const statusTitle = document.getElementById('status-title');
            const statusDesc = document.getElementById('status-desc');
            const telegramBtn = document.getElementById('telegram-btn');

            if (botUsername && startParam) {
                // Tạo liên kết sâu (deep link) tới Telegram Bot
                const tgUrl = `https://t.me/${botUsername}?start=${startParam}`;

                // Cập nhật nút phòng trường hợp trình duyệt chặn tự động chuyển hướng
                telegramBtn.href = tgUrl;

                // Tự động chuyển hướng sau 1.5 giây
                setTimeout(() => {
                    window.location.href = tgUrl;
                    
                    // Hiển thị nút bấm thủ công nếu tự động chuyển hướng bị chặn
                    loader.style.display = 'none';
                    statusDesc.innerText = "Nếu ứng dụng không tự động mở, vui lòng bấm vào nút bên dưới:";
                    telegramBtn.style.display = 'block';
                }, 1500);

            } else {
                // Trường hợp URL thiếu tham số
                loader.style.display = 'none';
                statusTitle.innerText = "❌ Lỗi Tham Số";
                statusTitle.style.color = "#ef4444";
                statusDesc.innerText = "Link truy cập không hợp lệ hoặc thiếu thông tin xác thực.";
            }
        });
    </script>
</body>
</html>
