<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090e;
            --border-color: #374151;
            --tai-color: #ef4444;
            --xiu-color: #3b82f6;
            --text-main: #f9fafb;

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;

        }

            flex: 1;
            height: 100%;
            position: relative;
            background: #000;
        }
        .game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .floating-tool {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(10, 14, 26, 0.97);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            z-index: 9999;

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            cursor: move;
        }
        .tool-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: #60a5fa;
            letter-spacing: 0.06em;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }
        .toggle-btn:hover { color: #fff; }
        .tool-body { display: flex; flex-direction: column; gap: 7px; }

        .session-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: #f59e0b;
            text-align: center;

        /* --- PREDICTION --- */
        .prediction-box {
            display: flex;

            align-items: center;

        }
        .pred-btn-small {
            width: 68px;

        .pred-xiu { background: rgba(59, 130, 246, 0.2); color: var(--xiu-color); border-color: var(--xiu-color); box-shadow: 0 0 18px rgba(59,130,246,0.35); }
        .pred-label { font-size: 0.55rem; margin-top: 2px; opacity: 0.7; }

        /* Confidence bar */

        /* Road map — visual streak display */

            width: 14px;

        .dot-xiu { background: var(--xiu-color); }

        /* Pattern tag */
        .pattern-badge {

            font-family: 'JetBrains Mono', monospace;

        .badge-12   { background: rgba(251,191,36,0.1); color: #fbbf24; border-color: #fbbf2444; }
        .badge-other{ background: rgba(156,163,175,0.1); color: #9ca3af; border-color: #9ca3af44; }

        /* MD5 */
        .md5-input-container { display: flex; gap: 4px; }
        .md5-input-container input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid var(--border-color);

        .btn-paste-run {

        .btn-paste-run:hover { background: #1d4ed8; }

        .status-text {
            text-align: center;
            font-size: 0.68rem;

            font-weight: 600;

        }

        /* Stats */
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;

        }
        .stats-row b { color: #e5e7eb; }
        .stat-tai { color: var(--tai-color); }
        .stat-xiu { color: var(--xiu-color); }

        /* Vote row — secondary algorithm vote */
        .vote-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
        }
        .vote-chip {
            font-size: 0.58rem;
            font-family: 'JetBrains Mono', monospace;

            padding: 3px 2px;
            text-align: center;
            border: 1px solid #374151;
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            line-height: 1.4;
        }
        .vote-chip.vote-t { border-color: #ef444488; color: #ef4444; }
        .vote-chip.vote-x { border-color: #3b82f688; color: #3b82f6; }

        /* Action buttons */
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .btn-action { padding: 7px; border-radius: 7px; font-weight: 700; cursor: pointer; border: none; font-size: 0.75rem; text-transform: uppercase; }
        .btn-win  { background: #059669; color: white; }
        .btn-lose { background: #dc2626; color: white; }
        .btn-action:hover { opacity: 0.88; }

<body>

<div class="game-container">
    <iframe src="https://lc79b.bet/" title="LC79 Game"></iframe>
</div>

<div class="floating-tool" id="floatingTool">
    <div class="tool-header" id="toolHeader">
        <span class="tool-title">⚡ PATTERN AI PRO v2</span>
        <button class="toggle-btn" id="toggleMinimize">−</button>
    </div>
    <div class="tool-body" id="toolBody">

        <div class="session-tag" id="currentSessionDisplay">#Syncing...</div>

        <div class="prediction-box">
            <div id="mainPredCircle" class="pred-btn-small pred-xiu">

        <!-- Confidence bar -->

        </div>

        <!-- Road map 20 phiên gần nhất -->
        <div class="road-wrap" id="roadMap"></div>

        <!-- Vote từng thuật toán -->
        <div class="vote-row" id="voteRow">
            <div class="vote-chip">...</div>

            <div class="vote-chip">...</div>
            <div class="vote-chip">...</div>
            <div class="vote-chip">...</div>
            <div class="vote-chip">...</div>
        </div>

        <!-- MD5 soi trực tiếp -->
        <div class="md5-input-container">
            <input type="text" id="md5InputBox" placeholder="Dán mã MD5 / _id để soi...">
            <button class="btn-paste-run" id="btnRunMd5">SOI</button>
        </div>

        <!-- Stats bar -->
        <div class="stats-row">
            <span class="stat-tai">T: <b id="statTaiCnt">0</b></span>
            <span class="stat-xiu">X: <b id="statXiuCnt">0</b></span>
            <span>Streak: <b id="streakStatus">0</b></span>
            <span>Win: <b id="winRate">-</b></span>
        </div>

        <div class="action-row">
            <button class="btn-action btn-win" id="btnWin">WIN (+1)</button>
            <button class="btn-action btn-lose" id="btnLose">LOSE (GÃY)</button>
        </div>

    </div>
</div>

<script>
// ─────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────
const API_URL = "https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=eece3a8c9594cd249d805a0f4ccd9e1d";

let apiList      = [];   // full history newest → oldest
let lastId       = null;
let currentStreak= 0;
let totalWin     = 0;
let totalBet     = 0;
let forcedMd5    = false;

// ─────────────────────────────────────────────
//  FETCH
// ─────────────────────────────────────────────
async function fetchAPI() {
    try {
        const r = await fetch(API_URL);
        const d = await r.json();
        if (d && d.list && d.list.length > 0) {
            apiList = d.list;
            const newest = apiList[0];
            if (lastId !== newest.id) {
                lastId = newest.id;
                if (!forcedMd5) runEngine();
            }
        }
    } catch(e) {
        setStatus("Lỗi kết nối / CORS");
    }
}

// ─────────────────────────────────────────────
//  ROAD MAP (20 dots)
// ─────────────────────────────────────────────
function renderRoad(results) {
    const wrap = document.getElementById('roadMap');
    wrap.innerHTML = '';
    const slice = results.slice(0, 20).reverse(); // hiển thị từ cũ → mới
    slice.forEach(r => {
        const d = document.createElement('div');
        d.className = `road-dot ${r === 'TAI' ? 'dot-tai' : 'dot-xiu'}`;
        d.textContent = r === 'TAI' ? 'T' : 'X';
        wrap.appendChild(d);
    });
}

// ─────────────────────────────────────────────
//  CORE ENGINE — 8 THUẬT TOÁN
// ─────────────────────────────────────────────
/*
  Votes được thu thập từ 8 algorithm, mỗi cái trả về 'TAI' | 'XIU' | null
  Kết quả cuối = weighted majority vote
*/

function runEngine(customHash = null) {
    if (apiList.length === 0) return;

    const results  = apiList.map(x => x.resultTruyenThong);  // newest→oldest
    const points   = apiList.map(x => x.point);
    const dices    = apiList.map(x => x.dices);
    const taiCount = apiList.filter(x => x.resultTruyenThong === 'TAI').length;
    const xiuCount = apiList.filter(x => x.resultTruyenThong === 'XIU').length;

    renderRoad(results);

    document.getElementById('statTaiCnt').innerText = taiCount;
    document.getElementById('statXiuCnt').innerText = xiuCount;
    document.getElementById('currentSessionDisplay').innerText = `#${apiList[0].id + 1}`;

    // ── MD5 override ──
    if (customHash && customHash.trim().length > 5) {
        const pred = decodeMD5(customHash.trim());
        applyPrediction(pred.result, pred.confidence, "Soi mã MD5 trực tiếp", "badge-other", []);
        setStatus(`Hash decode: [${pred.d1},${pred.d2},${pred.d3}] = ${pred.total}đ`);
        return;
    }

    // ── 8 algorithms vote ──
    const votes = [
        algo_BetPattern(results),       // Cầu bệt
        algo_1_1(results),              // Cầu 1-1
        algo_2_2(results),              // Cầu 2-2
        algo_1_2(results),              // Cầu 1-2 / 2-1
        algo_LongBet_Break(results),    // Bệt dài -> bẻ
        algo_PointTrend(points),        // Xu hướng điểm
        algo_MarkovChain(results),      // Markov chain order-2
        algo_Balance(taiCount, xiuCount, results), // Cân bằng tần suất
    ];

    // Đếm vote có trọng số
    const weights = [3, 3, 2, 2, 3, 1, 2, 1]; // tổng 17
    let scoreTai = 0, scoreXiu = 0;
    const chipData = [];

    votes.forEach((v, i) => {
        const label = ['Bệt','1-1','2-2','1-2','Bẻ','Point','Markov','Balance'][i];
        if (v === 'TAI') { scoreTai += weights[i]; chipData.push({ label, side: 'T' }); }
        else if (v === 'XIU') { scoreXiu += weights[i]; chipData.push({ label, side: 'X' }); }
        else chipData.push({ label, side: '?' });
    });

    const total = scoreTai + scoreXiu || 1;
    const finalPred = scoreTai >= scoreXiu ? 'TAI' : 'XIU';
    const confidence = Math.round((Math.max(scoreTai, scoreXiu) / total) * 100);

    // Detect dominant pattern name
    const { name, badgeClass } = detectPatternName(results);

    renderVotes(chipData);
    applyPrediction(finalPred, confidence, name, badgeClass, chipData);
    setStatus(`Phân tích ${results.length} phiên | Score T:${scoreTai} X:${scoreXiu}`);
}

// ─────────────────────────────────────────────
//  ALGORITHMS
// ─────────────────────────────────────────────

// 1. Cầu bệt: >= 3 giống nhau liên tiếp → tiếp tục bệt
function algo_BetPattern(r) {
    if (r.length < 3) return null;
    if (r[0] === r[1] && r[1] === r[2]) return r[0]; // tiếp bệt
    return null;
}

// 2. Cầu 1-1: xen kẽ đều >= 4 tay
function algo_1_1(r) {
    if (r.length < 4) return null;
    const alt = r[0] !== r[1] && r[1] !== r[2] && r[2] !== r[3];
    if (!alt) return null;
    return r[0] === 'TAI' ? 'XIU' : 'TAI'; // đảo tiếp
}

// 2. Cầu 2-2: từng cặp 2 giống nhau
function algo_2_2(r) {
    if (r.length < 6) return null;
    // [0,1] same, [2,3] same, [4,5] same, [0] != [2]
    const ok = r[0]===r[1] && r[2]===r[3] && r[4]===r[5]
             && r[0]!==r[2] && r[2]!==r[4];
    if (!ok) return null;
    // cầu 2-2 → đang ở đầu cặp mới, đảo sang cặp kế
    return r[0] === 'TAI' ? 'XIU' : 'TAI';
}

// 3. Cầu 1-2 / 2-1: xen kẽ cặp
function algo_1_2(r) {
    if (r.length < 6) return null;
    // pattern 1-2: T X X T X X  →  [0]≠[1], [1]=[2], [3]≠[4], [4]=[5]
    const p12 = r[0]!==r[1] && r[1]===r[2] && r[3]!==r[4] && r[4]===r[5] && r[0]!==r[3];
    if (p12) return r[0] === 'TAI' ? 'XIU' : 'TAI';
    // pattern 2-1: T T X T T X
    const p21 = r[0]===r[1] && r[1]!==r[2] && r[3]===r[4] && r[4]!==r[5] && r[0]!==r[3];
    if (p21) return r[0] === 'TAI' ? 'XIU' : 'TAI';
    return null;
}

// 4. Bệt dài >= 5 → bẻ cầu
function algo_LongBet_Break(r) {
    if (r.length < 5) return null;
    let cnt = 1;
    for (let i = 1; i < r.length; i++) {
        if (r[i] === r[0]) cnt++;
        else break;
    }
    if (cnt >= 5) return r[0] === 'TAI' ? 'XIU' : 'TAI';
    return null;
}

// 5. Xu hướng điểm (point trend): điểm trung bình 5 phiên gần → cao: TAI, thấp: XIU
function algo_PointTrend(pts) {
    if (pts.length < 5) return null;
    const avg5 = pts.slice(0,5).reduce((a,b)=>a+b,0) / 5;
    if (avg5 >= 11.5) return 'TAI';
    if (avg5 <= 9.5)  return 'XIU';
    return null;
}

// 6. Markov Chain order-2: dự đoán dựa trên transition state 2 tay liên tiếp trước
function algo_MarkovChain(r) {
    if (r.length < 10) return null;
    // Build transition table từ history
    const tbl = {}; // key: "TT","TX","XT","XX" → {TAI:n, XIU:n}
    for (let i = 2; i < r.length; i++) {
        const key = r[i] === 'TAI' ? 'T' : 'X';
        const prev = (r[i-2]==='TAI'?'T':'X') + (r[i-1]==='TAI'?'T':'X');
        if (!tbl[prev]) tbl[prev] = {TAI:0, XIU:0};
        tbl[prev][r[i-2]==='TAI'?'TAI':'XIU']; // dư, dùng below
        tbl[prev][r[i]] = (tbl[prev][r[i]]||0) + 1;
    }
    // Lookup current 2 tay mới nhất
    const cur = (r[0]==='TAI'?'T':'X') + (r[1]==='TAI'?'T':'X'); // newest pair (reversed: [0]=latest)
    // Vì list newest→oldest, state hiện tại = r[1] r[0] (older first)
    const state = (r[1]==='TAI'?'T':'X') + (r[0]==='TAI'?'T':'X');
    if (!tbl[state]) return null;
    const entry = tbl[state];
    const t = entry['TAI'] || 0;
    const x = entry['XIU'] || 0;
    if (t === x) return null;
    return t > x ? 'TAI' : 'XIU';
}

// 7. Balance: nếu 10 phiên gần lệch hẳn → kéo về cân bằng
function algo_Balance(taiTotal, xiuTotal, r) {
    const recent = r.slice(0, 10);
    const rt = recent.filter(x=>x==='TAI').length;
    const rx = recent.filter(x=>x==='XIU').length;
    if (rt >= 7) return 'XIU'; // quá nhiều TAI → kéo XIU
    if (rx >= 7) return 'TAI'; // quá nhiều XIU → kéo TAI
    return null;
}

// ─────────────────────────────────────────────
//  DETECT DOMINANT PATTERN NAME
// ─────────────────────────────────────────────
function detectPatternName(r) {
    if (r.length < 4) return { name: 'Chưa đủ dữ liệu', badgeClass: 'badge-other' };

    // Bệt dài
    let betLen = 1;
    for (let i=1;i<r.length;i++) { if(r[i]===r[0]) betLen++; else break; }
    if (betLen >= 5) return { name: `Bệt dài ${betLen} — Sắp bẻ`, badgeClass: 'badge-bet' };
    if (betLen >= 3) return { name: `Cầu Bệt ${betLen} tay`, badgeClass: 'badge-bet' };

    // 1-1
    if (r[0]!==r[1] && r[1]!==r[2] && r[2]!==r[3])
        return { name: 'Cầu 1-1 (Xen kẽ đều)', badgeClass: 'badge-11' };

    // 2-2
    if (r.length>=6 && r[0]===r[1] && r[2]===r[3] && r[4]===r[5] && r[0]!==r[2] && r[2]!==r[4])
        return { name: 'Cầu 2-2 (Cặp đôi)', badgeClass: 'badge-22' };

    // 1-2
    if (r.length>=6 && r[0]!==r[1] && r[1]===r[2] && r[3]!==r[4] && r[4]===r[5])
        return { name: 'Cầu 1-2 (Lệch cặp)', badgeClass: 'badge-12' };

    // 2-1
    if (r.length>=6 && r[0]===r[1] && r[1]!==r[2] && r[3]===r[4] && r[4]!==r[5])
        return { name: 'Cầu 2-1 (Đảo cặp)', badgeClass: 'badge-12' };

    return { name: 'Cầu Hỗn hợp (Multi-vote)', badgeClass: 'badge-other' };
}

// ─────────────────────────────────────────────
//  MD5 DECODE
// ─────────────────────────────────────────────
function decodeMD5(hash) {
    // Dùng byte sum + positional weight để ra 3 xúc xắc giả định
    let s = 0;
    for (let i=0;i<hash.length;i++) s += hash.charCodeAt(i) * (i+1);
    const d1 = (s % 6) + 1;
    const d2 = (Math.floor(s / 13) % 6) + 1;
    const d3 = (Math.floor(s / 31) % 6) + 1;
    const total = d1 + d2 + d3;
    const result = total >= 11 ? 'TAI' : 'XIU';
    const confidence = total >= 14 || total <= 7 ? 82 : 61;
    return { result, confidence, d1, d2, d3, total };
}

// ─────────────────────────────────────────────
//  UI HELPERS
// ─────────────────────────────────────────────
function applyPrediction(pred, confidence, patternName, badgeClass, chips) {
    const circle = document.getElementById('mainPredCircle');
    document.getElementById('predText').innerText = pred;
    document.getElementById('predLabel').innerText = confidence + '%';
    circle.className = `pred-btn-small ${pred === 'TAI' ? 'pred-tai' : 'pred-xiu'}`;

    // Confidence bar
    const bar = document.getElementById('confBar');
    const pct = document.getElementById('confPct');
    bar.style.width = confidence + '%';
    bar.className = 'conf-bar-fill ' + (confidence >= 70 ? 'conf-high' : confidence >= 55 ? 'conf-mid' : 'conf-low');
    pct.innerText = confidence + '%';

    // Pattern badge
    const badge = document.getElementById('patternBadge');
    badge.textContent = patternName;
    badge.className = `pattern-badge ${badgeClass}`;
}

function renderVotes(chips) {
    const row = document.getElementById('voteRow');
    row.innerHTML = '';
    chips.forEach(c => {
        const el = document.createElement('div');
        el.className = `vote-chip ${c.side==='T'?'vote-t':c.side==='X'?'vote-x':''}`;
        el.innerHTML = `${c.label}<br>${c.side==='T'?'TAI':c.side==='X'?'XIU':'—'}`;
        row.appendChild(el);
    });
}

function setStatus(txt) {
    document.getElementById('analysisDetailText').innerText = txt;
}

function updateWinRate() {
    const el = document.getElementById('winRate');
    if (totalBet === 0) { el.innerText = '-'; return; }
    el.innerText = Math.round((totalWin/totalBet)*100) + '%';
}

// ─────────────────────────────────────────────
//  EVENTS
// ─────────────────────────────────────────────
document.getElementById('btnRunMd5').addEventListener('click', () => {
    const val = document.getElementById('md5InputBox').value.trim();
    if (!val) { alert('Nhập mã MD5!'); return; }
    forcedMd5 = true;
    runEngine(val);
});
document.getElementById('md5InputBox').addEventListener('keypress', e => {
    if (e.key === 'Enter') document.getElementById('btnRunMd5').click();
});
document.getElementById('md5InputBox').addEventListener('input', e => {
    if (!e.target.value) { forcedMd5 = false; runEngine(); }
});

document.getElementById('btnWin').addEventListener('click', () => {
    currentStreak++;
    totalWin++;
    totalBet++;
    document.getElementById('streakStatus').innerText = `+${currentStreak}`;
    updateWinRate();
    forcedMd5 = false;
    fetchAPI();
});

document.getElementById('btnLose').addEventListener('click', () => {
    currentStreak = 0;
    totalBet++;
    document.getElementById('streakStatus').innerText = 'Gãy';
    updateWinRate();
    // Đảo ngược prediction khi gãy
    const cur = document.getElementById('predText').innerText;
    const flip = cur === 'TAI' ? 'XIU' : 'TAI';
    const circle = document.getElementById('mainPredCircle');
    document.getElementById('predText').innerText = flip;
    document.getElementById('predLabel').innerText = '↺ Flip';
    circle.className = `pred-btn-small ${flip === 'TAI' ? 'pred-tai' : 'pred-xiu'}`;
    setStatus('Đảo hướng sau khi gãy cầu!');
    forcedMd5 = false;
    fetchAPI();
});

// ─────────────────────────────────────────────
//  MINIMIZE / DRAG
// ─────────────────────────────────────────────
const toggleBtn = document.getElementById('toggleMinimize');
const toolBody  = document.getElementById('toolBody');
let minimized = false;
toggleBtn.addEventListener('click', () => {
    minimized = !minimized;
    toolBody.style.display = minimized ? 'none' : 'flex';
    toggleBtn.innerText = minimized ? '+' : '−';
});

const tool = document.getElementById('floatingTool');
const header = document.getElementById('toolHeader');
let drag = false, sx, sy, ix, iy;
header.addEventListener('mousedown', e => {
    drag=true; sx=e.clientX; sy=e.clientY;
    ix=tool.offsetLeft; iy=tool.offsetTop; e.preventDefault();
});
document.addEventListener('mousemove', e => {
    if(!drag) return;
    tool.style.left = `${ix+(e.clientX-sx)}px`;
    tool.style.top  = `${iy+(e.clientY-sy)}px`;
    tool.style.right='auto';
});
document.addEventListener('mouseup', () => { drag=false; });

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
window.onload = () => {
    fetchAPI();
    setInterval(fetchAPI, 3000);
};
</script>
