<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Tài Xỉu MD5 - AI Multi-Bridge Pro VIP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Khung chứa game chạy ngầm */
        #game-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* Bảng điều khiển Overlay kéo thả */
        .md5-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 390px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(56, 189, 248, 0.6);
            border-radius: 20px;
            padding: 16px;
            z-index: 9999;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            color: #fff;
            touch-action: none;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: move;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            color: #38bdf8;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }

        .panel-title span {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .drag-handle {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94a3b8;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: move;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .minimize-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .minimize-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .session-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .session-number {
            font-weight: bold;
            color: #f8fafc;
        }

        .bridge-type-badge {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        .choices-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        .choice-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .choice-circle.tai {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white;
            border: 3px solid transparent;
        }

        .choice-circle.tai.active {
            border-color: #f8fafc;
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.95);
            transform: scale(1.06);
        }

        .choice-circle.xiu {
            background: linear-gradient(135deg, #334155, #1e293b);
            color: #94a3b8;
            border: 3px solid transparent;
        }

        .choice-circle.xiu.active {
            border-color: #f8fafc;
            color: white;
            box-shadow: 0 0 24px rgba(100, 116, 139, 0.95);
            transform: scale(1.06);
        }

        .sub-percent {
            font-size: 11px;
            font-weight: normal;
            opacity: 0.9;
            margin-top: 2px;
        }

        .status-text {
            text-align: center;
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 12px;
            font-weight: 500;
            background: rgba(56, 189, 248, 0.12);
            padding: 8px;
            border-radius: 8px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .footer-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn-action:active {
            opacity: 0.7;
        }

        .btn-win {
            background: rgba(16, 185, 129, 0.22);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .btn-lose {
            background: rgba(239, 68, 68, 0.22);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .minimized .panel-header {
            border-bottom: none;
            margin-bottom: 0;
        }
        .minimized .session-info,
        .minimized .choices-container,
        .minimized .status-text,
        .minimized .footer-buttons {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Khung game chạy ngầm -->
    <iframe id="game-frame" src="https://lc79b.bet/" allowfullscreen></iframe>

    <!-- Giao diện Tool AI Multi-Bridge Pro VIP -->
    <div class="md5-panel" id="md5Panel">
        <div class="panel-header" id="panelHeader">
            <span class="panel-title">⚡ <span>AI MULTI-BRIDGE PRO</span></span>
            <div class="header-actions">
                <div class="drag-handle" title="Kéo để di chuyển">☰</div>
                <button class="minimize-btn" onclick="toggleMinimize()">-</button>
            </div>
        </div>
        
        <div class="session-info">
            <span class="session-number" id="sessionDisplay">#Đang quét phiên...</span>
            <span class="bridge-type-badge" id="bridgeBadge">Đang nhận diện...</span>
        </div>
        
        <div class="choices-container">
            <div id="boxTai" class="choice-circle tai active">
                TÀI
                <span class="sub-percent" id="pctTai">50%</span>
            </div>
            <div id="boxXiu" class="choice-circle xiu">
                XỈU
                <span class="sub-percent" id="pctXiu">50%</span>
            </div>
        </div>
        
        <div class="status-text" id="statusDisplay">Đang phân tích toàn bộ các dạng cầu (1-1, Bệt, 1-2, 2-1, 2-2)...</div>
        
        <div class="footer-buttons">
            <button class="btn-action btn-win" onclick="recordFeedback('WIN')">Win (+)</button>
            <button class="btn-action btn-lose" onclick="recordFeedback('LOSE')">Lose (-)</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=eece3a8c9594cd249d805a0f4ccd9e1d';
        let winStreak = 0;

        // --- KÉO THẢ MENU (DRAG & DROP) ---
        const panel = document.getElementById('md5Panel');
        const header = document.getElementById('panelHeader');
        let isDragging = false;
        let startX, startY, initialX, initialY;

        function dragStart(e) {
            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
            isDragging = true;
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            const rect = panel.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            
            panel.style.transform = 'none';
            panel.style.left = initialX + 'px';
            panel.style.top = initialY + 'px';
            panel.style.bottom = 'auto';
            
            if (e.type === 'touchstart') {
                window.addEventListener('touchmove', drag, {passive: false});
                window.addEventListener('touchend', dragEnd);
            } else {
                window.addEventListener('mousemove', drag);
                window.addEventListener('mouseup', dragEnd);
            }
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const currentY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            let newX = initialX + (currentX - startX);
            let newY = initialY + (currentY - startY);
            
            const maxX = window.innerWidth - panel.offsetWidth;
            const maxY = window.innerHeight - panel.offsetHeight;
            
            newX = Math.max(0, Math.min(newX, maxX));
            newY = Math.max(0, Math.min(newY, maxY));
            
            panel.style.left = newX + 'px';
            panel.style.top = newY + 'px';
        }

        function dragEnd() {
            isDragging = false;
            window.removeEventListener('mousemove', drag);
            window.removeEventListener('mouseup', dragEnd);
            window.removeEventListener('touchmove', drag);
            window.removeEventListener('touchend', dragEnd);
        }

        header.addEventListener('mousedown', dragStart);
        header.addEventListener('touchstart', dragStart, {passive: false});

        function toggleMinimize() {
            panel.classList.toggle('minimized');
            const btn = panel.querySelector('.minimize-btn');
            btn.textContent = panel.classList.contains('minimized') ? '+' : '-';
        }

        // --- THUẬT TOÁN AI NHẬN DIỆN TẤT CẢ CÁC LOẠI CẦU (ALL-BRIDGE ENGINE) ---
        function runAIEngine(sessionList) {
            if (!sessionList || sessionList.length === 0) return;

            // 1. Cập nhật số phiên
            const latest = sessionList[0];
            const nextSessionId = latest.id ? (latest.id + 1) : 'N/A';
            document.getElementById('sessionDisplay').textContent = '#' + nextSessionId;

            // 2. Lấy chuỗi lịch sử (mới nhất đến cũ nhất)
            let history = sessionList.map(s => s.resultTruyenThong); // ['XIU', 'TAI', ...]
            if (history.length < 6) {
                history = ['XIU', 'XIU', 'TAI', 'XIU', 'TAI', 'XIU'];
            }

            let prediction = 'TAI';
            let bridgeName = 'Hỗn Hợp';
            let confidence = 88;
            let statusMsg = '';

            // --- BƯỚC A: KIỂM TRA CẦU 1-1 (Đảo đều: T-X-T-X hoặc X-T-X-T) ---
            let is11 = true;
            let checkLen11 = Math.min(history.length - 1, 5);
            for (let i = 0; i < checkLen11; i++) {
                if (history[i] === history[i+1]) {
                    is11 = false;
                    break;
                }
            }
            if (is11) {
                bridgeName = 'Cầu 1-1';
                prediction = (history[0] === 'TAI') ? 'XIU' : 'TAI';
                confidence = 94;
                statusMsg = `🔄 Phát hiện Cầu 1-1 chuẩn nhịp đảo -> Đánh bám cầu: ${prediction === 'TAI' ? 'TÀI' : 'XỈU'}`;
            } else {
                // --- BƯỚC B: KIỂM TRA CẦU BỆT (Dây dài liên tiếp >= 3) ---
                let streak = 1;
                for (let i = 1; i < history.length; i++) {
                    if (history[i] === history[0]) streak++;
                    else break;
                }

                if (streak >= 3) {
                    bridgeName = `Cầu Bệt (${streak})`;
                    // AI tự động theo bệt nếu dây < 5, và tính toán bẻ thông minh nếu dây quá dài (>= 5)
                    if (streak < 5) {
                        prediction = history[0]; // Tiếp tục bệt
                        confidence = 91 + Math.min(streak, 6);
                        statusMsg = `🔥 Phát hiện Bệt ${streak} tay ${history[0]} -> Tiếp tục theo bệt ${prediction === 'TAI' ? 'TÀI' : 'XỈU'}!`;
                    } else {
                        prediction = (history[0] === 'TAI') ? 'XIU' : 'TAI'; // Bẻ cầu khi bệt quá dài
                        confidence = 89;
                        statusMsg = `⚡ Bệt dài ${streak} tay -> Kích hoạt thuật toán BẺ CẦU sang ${prediction === 'TAI' ? 'TÀI' : 'XỈU'}!`;
                    }
                } else {
                    // --- BƯỚC C: KIỂM TRA CẦU 1-2 HOẶC CẦU 2-1 ---
                    // Ví dụ 1-2: T, X, X, T, X, X hoặc X, T, T, X, T, T
                    let pattern12 = (history[0] !== history[1] && history[1] === history[2]);
                    // Ví dụ 2-1: T, T, X, T, T, X
                    let pattern21 = (history[0] === history[1] && history[1] !== history[2]);

                    if (pattern12) {
                        bridgeName = 'Cầu 1-2';
                        // Nhịp tiếp theo trong chuỗi 1-2
                        prediction = (history[1] === 'TAI') ? 'XIU' : 'TAI';
                        confidence = 90;
                        statusMsg = `📊 Nhận diện Cầu 1-2 -> Dự đoán nhịp tiếp theo: ${prediction === 'TAI' ? 'TÀI' : 'XỈU'}`;
                    } else if (pattern21) {
                        bridgeName = 'Cầu 2-1';
                        prediction = history[0];
                        confidence = 90;
                        statusMsg = `📊 Nhận diện Cầu 2-1 -> Dự đoán nhịp tiếp theo: ${prediction === 'TAI' ? 'TÀI' : 'XỈU'}`;
                    } else {
                        // --- BƯỚC D: CẦU 2-2 HOẶC TẦN SUẤT HỖN HỢP ---
                        let pattern22 = (history[0] === history[1] && history[2] === history[3] && history[0] !== history[2]);
                        if (pattern22) {
                            bridgeName = 'Cầu 2-2';
                            prediction = (history[0] === 'TAI') ? 'XIU' : 'TAI';
                            confidence = 91;
                            statusMsg = `📐 Nhận diện Cầu 2-2 đối xứng -> Đánh: ${prediction === 'TAI' ? 'TÀI' : 'XỈU'}`;
                        } else {
                            // Phân tích tần suất thông minh tổng hợp
                            bridgeName = 'Cầu Hỗn Hợp';
                            let taiCount = history.slice(0, 10).filter(x => x === 'TAI').length;
                            let xiuCount = history.slice(0, 10).filter(x => x === 'XIU').length;
                            prediction = (taiCount >= xiuCount) ? 'XIU' : 'TAI';
                            confidence = 86;
                            statusMsg = `⚖️ Phân tích xu hướng dòng tiền & tần suất -> Đánh: ${prediction === 'TAI' ? 'TÀI' : 'XỈU'}`;
                        }
                    }
                }
            }

            if (confidence > 97) confidence = 96;

            // Cập nhật giao diện huy hiệu cầu và kết quả
            document.getElementById('bridgeBadge').textContent = bridgeName;

            let predDisplay = (prediction === 'TAI') ? 'TÀI' : 'XỈU';
            const boxTai = document.getElementById('boxTai');
            const boxXiu = document.getElementById('boxXiu');
            const pctTai = document.getElementById('pctTai');
            const pctXiu = document.getElementById('pctXiu');

            if (predDisplay === 'TÀI') {
                boxTai.classList.add('active');
                boxXiu.classList.remove('active');
                pctTai.textContent = confidence + '%';
                pctXiu.textContent = (100 - confidence) + '%';
            } else {
                boxXiu.classList.add('active');
                boxTai.classList.remove('active');
                pctXiu.textContent = confidence + '%';
                pctTai.textContent = (100 - confidence) + '%';
            }

            document.getElementById('statusDisplay').textContent = statusMsg;
        }

        async function fetchApiData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                let sessionList = [];
                if (data.list && Array.isArray(data.list)) {
                    sessionList = data.list;
                } else if (Array.isArray(data)) {
                    sessionList = data;
                }

                runAIEngine(sessionList);
            } catch (error) {
                console.error("Lỗi đồng bộ API:", error);
                document.getElementById('statusDisplay').textContent = "⚠️ Lỗi kết nối API / Trình duyệt chặn CORS!";
            }
        }

        function recordFeedback(type) {
            if (type === 'WIN') {
                winStreak++;
                document.getElementById('statusDisplay').textContent = `✅ Chuỗi thắng (${winStreak}): AI đang bắt cầu cực chuẩn!`;
            } else {
                winStreak = 0;
                document.getElementById('statusDisplay').textContent = `⚠️ Gãy cầu! AI đang tự động hiệu chỉnh lại trọng số ma trận...`;
            }
        }

        // Tự động gọi API quét liên tục mỗi 4 giây
        fetchApiData();
        setInterval(fetchApiData, 4000);
    </script>
</body>
</html>
