<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 Pro Analyzer & lc79b.bet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090e;
            --border-color: #374151;
            --tai-color: #ef4444;
            --xiu-color: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
            user-select: none;
        }
        .game-container {
            flex: 1;
            height: 100%;
            position: relative;
            background: #000;
        }
        .game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Menu siêu nhỏ gọn, có thể kéo thả và thu gọn (-) */
        .floating-tool {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 240px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 9999;
        }
        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            cursor: move;
        }
        .tool-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #60a5fa;
            letter-spacing: 0.05em;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }
        .toggle-btn:hover { color: #fff; }
        
        .tool-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .session-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: #f59e0b;
            text-align: center;
        }
        .prediction-box {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pred-btn-small {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .pred-tai { background: rgba(239, 68, 68, 0.25); color: var(--tai-color); border-color: var(--tai-color); }
        .pred-xiu { background: rgba(59, 130, 246, 0.25); color: var(--xiu-color); border-color: var(--xiu-color); }
        
        .status-text {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .btn-action {
            padding: 6px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .btn-win { background: #059669; color: white; }
        .btn-lose { background: #dc2626; color: white; }
        .btn-action:hover { opacity: 0.9; }

        .stats-mini {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <iframe src="https://lc79b.bet/" title="LC79 Game"></iframe>
    </div>

    <div class="floating-tool" id="floatingTool">
        <div class="tool-header" id="toolHeader">
            <span class="tool-title">MD5 PRO AI</span>
            <button class="toggle-btn" id="toggleMinimize">−</button>
        </div>
        <div class="tool-body" id="toolBody">
            <div class="session-tag" id="currentSessionDisplay">#6976448</div>

            <div class="prediction-box">
                <div id="mainPredCircle" class="pred-btn-small pred-xiu">XIU</div>
            </div>

            <div class="status-text" id="analysisDetailText">Thuật toán Pro: Đang lọc cầu đảo/bệt...</div>

            <div class="stats-mini">
                <span>Tài: <b id="statTaiCnt">8</b></span>
                <span>Xỉu: <b id="statXiuCnt">7</b></span>
                <span>Win: <b id="streakStatus">0</b></span>
            </div>

            <div class="action-row">
                <button class="btn-action btn-win" id="btnWin">Win (+1)</button>
                <button class="btn-action btn-lose" id="btnLose">Lose (Gãy)</button>
            </div>
        </div>
    </div>

    <script>
        const apiDataResponse = {
          "list": [
            { "id": 6976448, "_id": "6a72cc776445b4350bd53843", "resultTruyenThong": "XIU", "dices": [2, 3, 2], "point": 7 },
            { "id": 6976447, "_id": "6a72cc446445b4350bd51dfe", "resultTruyenThong": "XIU", "dices": [3, 4, 1], "point": 8 },
            { "id": 6976446, "_id": "6a72cc116445b4350bd50504", "resultTruyenThong": "TAI", "dices": [5, 5, 4], "point": 14 },
            { "id": 6976445, "_id": "6a72cbdf6445b4350bd4eab7", "resultTruyenThong": "XIU", "dices": [2, 2, 6], "point": 10 },
            { "id": 6976444, "_id": "6a72cbac6445b4350bd4d152", "resultTruyenThong": "XIU", "dices": [2, 5, 3], "point": 10 },
            { "id": 6976443, "_id": "6a72cb796445b4350bd4b490", "resultTruyenThong": "XIU", "dices": [4, 3, 3], "point": 10 },
            { "id": 6976442, "_id": "6a72cb466445b4350bd496fd", "resultTruyenThong": "TAI", "dices": [5, 1, 5], "point": 11 },
            { "id": 6976441, "_id": "6a72cb146445b4350bd47ba4", "resultTruyenThong": "TAI", "dices": [5, 4, 3], "point": 12 },
            { "id": 6976440, "_id": "6a72cae16445b4350bd46418", "resultTruyenThong": "TAI", "dices": [6, 1, 5], "point": 12 },
            { "id": 6976439, "_id": "6a72caae6445b4350bd44953", "resultTruyenThong": "TAI", "dices": [5, 1, 6], "point": 12 },
            { "id": 6976438, "_id": "6a72ca7b6445b4350bd428e7", "resultTruyenThong": "XIU", "dices": [3, 1, 1], "point": 5 },
            { "id": 6976437, "_id": "6a72ca496445b4350bd40fa0", "resultTruyenThong": "TAI", "dices": [5, 4, 6], "point": 15 },
            { "id": 6976436, "_id": "6a72ca166445b4350bd3f3d2", "resultTruyenThong": "TAI", "dices": [6, 2, 3], "point": 11 },
            { "id": 6976435, "_id": "6a72c9e46445b4350bd3daba", "resultTruyenThong": "TAI", "dices": [2, 4, 5], "point": 11 },
            { "id": 6976434, "_id": "6a72c9b16445b4350bd3bfea", "resultTruyenThong": "XIU", "dices": [3, 3, 3], "point": 9 }
          ],
          "typeStat": { "XIU": 7, "TAI": 8 }
        };

        let currentStreak = 0;
        let predictionState = "XIU"; 

        // Thuật toán Pro: Phân tích lịch sử không bị kẹt 1 bên (soi nhịp bệt/đảo dựa trên kết quả thực tế gần nhất)
        function runProAlgorithm() {
            const list = apiDataResponse.list;
            const latest = list[0];
            document.getElementById('currentSessionDisplay').innerText = `#${latest.id + 1}`;
            
            document.getElementById('statTaiCnt').innerText = apiDataResponse.typeStat.TAI;
            document.getElementById('statXiuCnt').innerText = apiDataResponse.typeStat.XIU;

            // Thuật toán phát hiện cầu: Đếm số lượng kết quả liên tiếp của phiên gần nhất
            let lastRes = latest.resultTruyenThong;
            let streakCount = 0;
            for (let item of list) {
                if (item.resultTruyenThong === lastRes) streakCount++;
                else break;
            }

            // Logic thông minh: Bệt dài >= 3 thì đảo cầu, ngắn thì theo cầu
            if (streakCount >= 3) {
                predictionState = (lastRes === "TAI") ? "XIU" : "TAI";
                document.getElementById('analysisDetailText').innerText = `Bệt ${streakCount} tay -> Đánh đảo cầu`;
            } else {
                // Soi cân bằng tổng điểm xúc xắc 3 phiên gần nhất
                let recentPoints = list.slice(0, 3).reduce((acc, curr) => acc + curr.point, 0) / 3;
                predictionState = recentPoints > 10 ? "XIU" : "TAI";
                document.getElementById('analysisDetailText').innerText = `Nhịp ngắn -> Đánh theo xu hướng`;
            }

            const circle = document.getElementById('mainPredCircle');
            circle.innerText = predictionState;
            circle.className = `pred-btn-small ${predictionState === "TAI" ? "pred-tai" : "pred-xiu"}`;
        }

        // Xử lý nút Win / Lose tự động cập nhật hệ thống
        document.getElementById('btnWin').addEventListener('click', () => {
            currentStreak++;
            document.getElementById('streakStatus').innerText = `+${currentStreak}`;
            // Thêm kết quả giả định vừa ăn vào đầu mảng để test thuật toán liên tục
            apiDataResponse.list.unshift({
                id: apiDataResponse.list[0].id + 1,
                resultTruyenThong: predictionState,
                point: predictionState === "TAI" ? 12 : 9
            });
            apiDataResponse.typeStat[predictionState]++;
            runProAlgorithm();
        });

        document.getElementById('btnLose').addEventListener('click', () => {
            currentStreak = 0;
            document.getElementById('streakStatus').innerText = `Gãy`;
            let opposite = predictionState === "TAI" ? "XIU" : "TAI";
            apiDataResponse.list.unshift({
                id: apiDataResponse.list[0].id + 1,
                resultTruyenThong: opposite,
                point: opposite === "TAI" ? 13 : 8
            });
            apiDataResponse.typeStat[opposite]++;
            runProAlgorithm();
        });

        // Tính năng Thu gọn / Mở rộng Menu (-)
        const toggleBtn = document.getElementById('toggleMinimize');
        const toolBody = document.getElementById('toolBody');
        let isMinimized = false;
        toggleBtn.addEventListener('click', () => {
            isMinimized = !isMinimized;
            toolBody.style.display = isMinimized ? 'none' : 'flex';
            toggleBtn.innerText = isMinimized ? '+' : '−';
        });

        // Tính năng Kéo thả Menu (Draggable) trên mọi màn hình
        const tool = document.getElementById('floatingTool');
        const header = document.getElementById('toolHeader');
        let isDragging = false, startX, startY, initialX, initialY;

        header.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialX = tool.offsetLeft;
            initialY = tool.offsetTop;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            tool.style.left = `${initialX + dx}px`;
            tool.style.top = `${initialY + dy}px`;
            tool.style.right = 'auto';
        });

        document.addEventListener('mouseup', () => { isDragging = false; });

        // Khởi chạy
        window.onload = () => {
            runProAlgorithm();
        };
    </script>
</body>
</html>
