<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Tài Xỉu MD5 - Smart Break VIP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Khung chứa game chạy ngầm */
        #game-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* Bảng điều khiển Overlay nổi lên trên */
        .md5-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 16px;
            z-index: 10;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            color: #fff;
            transition: all 0.3s ease;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .panel-title {
            color: #38bdf8;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .panel-title span {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .minimize-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .minimize-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .session-number {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .choices-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        .choice-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .choice-circle.tai {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white;
            border: 3px solid transparent;
        }

        .choice-circle.tai.active {
            border-color: #f8fafc;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
            transform: scale(1.05);
        }

        .choice-circle.xiu {
            background: linear-gradient(135deg, #334155, #1e293b);
            color: #94a3b8;
            border: 3px solid transparent;
        }

        .choice-circle.xiu.active {
            border-color: #f8fafc;
            color: white;
            box-shadow: 0 0 20px rgba(100, 116, 139, 0.8);
            transform: scale(1.05);
        }

        .sub-percent {
            font-size: 11px;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 2px;
        }

        .status-text {
            text-align: center;
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 12px;
            font-weight: 500;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px;
            border-radius: 8px;
        }

        .footer-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn-action:active {
            opacity: 0.7;
        }

        .btn-win {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .btn-lose {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .minimized .panel-header {
            margin-bottom: 0;
        }
        .minimized .session-number,
        .minimized .choices-container,
        .minimized .status-text,
        .minimized .footer-buttons {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Khung game chạy ngầm -->
    <iframe id="game-frame" src="https://lc79b.bet/" allowfullscreen></iframe>

    <!-- Giao diện Tool MD5 Smart Break -->
    <div class="md5-panel" id="md5Panel">
        <div class="panel-header">
            <span class="panel-title">⚡ <span>MD5 SMART BREAK VIP</span></span>
            <button class="minimize-btn" onclick="toggleMinimize()">-</button>
        </div>
        
        <div class="session-number" id="sessionDisplay">#6974735</div>
        
        <div class="choices-container">
            <div id="boxTai" class="choice-circle tai active">
                TÀI
                <span class="sub-percent" id="pctTai">50%</span>
            </div>
            <div id="boxXiu" class="choice-circle xiu">
                XỈU
                <span class="sub-percent" id="pctXiu">50%</span>
            </div>
        </div>
        
        <div class="status-text" id="statusDisplay">Đang phân tích cấu trúc cầu...</div>
        
        <div class="footer-buttons">
            <button class="btn-action btn-win" onclick="recordFeedback('WIN')">Win (+)</button>
            <button class="btn-action btn-lose" onclick="recordFeedback('LOSE')">Lose (-)</button>
        </div>
    </div>

    <script>
        // Biến lưu trữ trạng thái lịch sử mô phỏng cho thuật toán Smart Break
        let currentSession = 6974735;
        let historyQueue = ['TÀI', 'TÀI', 'XỈU', 'TÀI', 'TÀI']; // Lưu 5 phiên gần nhất
        let winStreak = 0;

        function toggleMinimize() {
            const panel = document.getElementById('md5Panel');
            const btn = document.querySelector('.minimize-btn');
            panel.classList.toggle('minimized');
            btn.textContent = panel.classList.contains('minimized') ? '+' : '-';
        }

        // THUẬT TOÁN VIP SMART BREAK
        function runSmartBreakAlgorithm() {
            currentSession++;
            document.getElementById('sessionDisplay').textContent = '#' + currentSession;
            
            document.getElementById('statusDisplay').textContent = "Đang quét mã MD5 & Tính toán cầu bệt...";

            setTimeout(() => {
                // Đếm số lượng Tài/Xỉu trong lịch sử gần đây để tìm điểm gãy (Smart Break)
                let taiCount = historyQueue.filter(x => x === 'TÀI').length;
                let xiuCount = historyQueue.filter(x => x === 'XỈU').length;
                
                let prediction = 'TÀI';
                let confidence = Math.floor(Math.random() * 12) + 84; // 84% - 95% độ chính xác giả lập VIP
                let statusMsg = "";

                // Logic Smart Break: Nếu cầu bệt về 1 phía quá nhiều, thuật toán tính toán điểm gãy ngược lại
                let lastItem = historyQueue[historyQueue.length - 1];
                let secondLast = historyQueue[historyQueue.length - 2];

                if (lastItem === secondLast && lastItem === historyQueue[historyQueue.length - 3]) {
                    // Phát hiện cầu bệt 3 tay trở lên -> Kích hoạt Smart Break (Dự đoán bẻ cầu)
                    prediction = (lastItem === 'TÀI') ? 'XỈU' : 'TÀI';
                    statusMsg = `🔥 Smart Break: Phát hiện cầu bệt ${lastItem}, bẻ cầu sang ${prediction}!`;
                    confidence += 3; // Tăng độ tin cậy khi bẻ đúng nhịp bệt
                } else {
                    // Cầu đối xứng hoặc hỗn hợp bình thường
                    prediction = (taiCount > xiuCount) ? 'XỈU' : 'TÀI';
                    statusMsg = `📊 Phân tích luồng MD5 ổn định. Đánh: ${prediction}`;
                }

                if (confidence > 98) confidence = 96;

                // Cập nhật giao diện trực quan
                const boxTai = document.getElementById('boxTai');
                const boxXiu = document.getElementById('boxXiu');
                const pctTai = document.getElementById('pctTai');
                const pctXiu = document.getElementById('pctXiu');

                if (prediction === 'TÀI') {
                    boxTai.classList.add('active');
                    boxXiu.classList.remove('active');
                    pctTai.textContent = confidence + '%';
                    pctXiu.textContent = (100 - confidence) + '%';
                } else {
                    boxXiu.classList.add('active');
                    boxTai.classList.remove('active');
                    pctXiu.textContent = confidence + '%';
                    pctTai.textContent = (100 - confidence) + '%';
                }

                document.getElementById('statusDisplay').textContent = statusMsg;

                // Đẩy kết quả giả lập vào hàng đợi lịch sử
                historyQueue.shift();
                historyQueue.push(prediction);

            }, 1000);
        }

        function recordFeedback(type) {
            if (type === 'WIN') {
                winStreak++;
                document.getElementById('statusDisplay').textContent = `✅ Chuỗi thắng (${winStreak}): Thuật toán đang tối ưu hóa độ chính xác!`;
            } else {
                winStreak = 0;
                document.getElementById('statusDisplay').textContent = `⚠️ Đã ghi nhận lệnh gãy. Thuật toán đang tự động hiệu chỉnh biên độ...`;
            }
        }

        // Tự động chạy thuật toán quét phiên mới mỗi 15 giây
        setInterval(runSmartBreakAlgorithm, 15000);
    </script>
</body>
</html>
